name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: morphe-lsposed-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release-artifact:
    name: Signed release artifact
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew
      - name: Restore release signing material
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/morphe-lsposed-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_dir/release.keystore"
          chmod 600 "$signing_dir/release.keystore"
          cat > signing.properties <<EOF_SIGNING
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEYSTORE_ALIAS=$KEYSTORE_ALIAS
          KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD
          KEYSTORE_FILE=$signing_dir/release.keystore
          EOF_SIGNING
          chmod 600 signing.properties
      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK signature and metadata
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -E "^package: name='app.morphe.lsposed'|^application-label:'Morphe LSPosed'"
          sha256sum "$apk" > "$apk.sha256"
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphe-lsposed-signed-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/morphe-lsposed-signing" signing.properties
