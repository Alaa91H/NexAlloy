name: Publish Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew
      - name: Restore release signing material
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/morphe-lsposed-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_dir/release.keystore"
          chmod 600 "$signing_dir/release.keystore"
          cat > signing.properties <<EOF_SIGNING
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEYSTORE_ALIAS=$KEYSTORE_ALIAS
          KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD
          KEYSTORE_FILE=$signing_dir/release.keystore
          EOF_SIGNING
          chmod 600 signing.properties
      - name: Test and build signed release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signature and prepare release files
        id: artifact
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -E "^package: name='app.morphe.lsposed'|^application-label:'Morphe LSPosed'"
          artifact_name="Morphe-LSPosed-${{ github.ref_name }}.apk"
          cp "$apk" "$artifact_name"
          sha256sum "$artifact_name" > "$artifact_name.sha256"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Morphe LSPosed $TAG" \
            --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/morphe-lsposed-signing" signing.properties
